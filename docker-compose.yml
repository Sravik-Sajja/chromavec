services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: ./server
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./server:/app
    depends_on:
      - redis

  worker:
    build: ./server
    command: celery -A celery_app worker --loglevel=info --pool=threads
    env_file:
      - ./server/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./server:/app
    depends_on:
      - redis

  client:
    build: ./client
    command: node node_modules/.bin/vite --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      - api
    environment:
      - CI=true
    stdin_open: true
    tty: true

volumes:
  redis_data:
  client_node_modules: